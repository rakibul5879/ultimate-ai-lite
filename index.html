<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultimate AI Lite - v2.0</title>

    <!-- Markdown & Sanitization (ES5 Compatible Loaders) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js/lib/core.min.js"></script>
    <link id="hljs-theme" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js/styles/github-dark.min.css">
    
    <style>
        /* CSS Variables for Dynamic Theming (Fallback to existing hardcoded styles handled via overriding below) */
        :root {
            --bg-color: #212121;
            --surface-color: #171717;
            --surface-hover: #2f2f2f;
            --border-color: #333333;
            --border-light: #444444;
            --text-main: #ececec;
            --text-muted: #aaaaaa;
            --text-dark: #888888;
            --btn-bg: #2f2f2f;
            --btn-text: #cccccc;
            --primary-bg: #ffffff;
            --primary-text: #000000;
            --msg-ai: #171717;
            --msg-user: #2f2f2f;
        }

        [data-theme="light"] {
            --bg-color: #f5f5f5;
            --surface-color: #ffffff;
            --surface-hover: #e0e0e0;
            --border-color: #dddddd;
            --border-light: #cccccc;
            --text-main: #222222;
            --text-muted: #555555;
            --text-dark: #888888;
            --btn-bg: #e0e0e0;
            --btn-text: #333333;
            --primary-bg: #000000;
            --primary-text: #ffffff;
            --msg-ai: #ffffff;
            --msg-user: #e3f2fd;
        }

        /* EXISTING STYLES (Preserved exactly as requested, but mapped to CSS vars where seamless) */
        * {
            -webkit-box-sizing: border-box;
            -moz-box-sizing: border-box;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-transition: none !important;
            transition: none !important;
            -webkit-animation: none !important;
            animation: none !important;
        }

        body {
            background-color: var(--bg-color, #212121);
            color: var(--text-main, #ececec);
            font-family: Arial, sans-serif;
            font-size: 14px;
            height: 100vh;
            overflow: hidden;
        }

        /* Login Lock Screen */
        #login-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--surface-color, #171717);
            z-index: 100;
            padding: 30px 20px;
            text-align: center;
        }

        .login-box {
            max-width: 300px;
            margin: 40px auto 0 auto;
            background-color: var(--bg-color, #212121);
            padding: 20px;
            border: 1px solid var(--border-light, #444444);
        }

        .login-box input {
            width: 100%;
            padding: 8px;
            margin-bottom: 12px;
            background-color: var(--surface-color, #171717);
            border: 1px solid var(--border-light, #444444);
            color: var(--text-main, #ffffff);
        }

        .login-box button {
            width: 100%;
            padding: 8px;
            background-color: var(--primary-bg, #ffffff);
            color: var(--primary-text, #000000);
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        /* Navigation Header */
        #header {
            height: 48px;
            background-color: var(--surface-color, #171717);
            border-bottom: 1px solid var(--border-color, #333333);
            padding: 0 8px;
            line-height: 48px;
            position: absolute;
            top: 0; left: 0; right: 0;
            z-index: 10;
        }

        .nav-btn {
            background-color: var(--btn-bg, #2f2f2f);
            color: var(--btn-text, #cccccc);
            border: 1px solid var(--border-light, #444444);
            padding: 4px 8px;
            font-size: 12px;
            margin-top: 10px;
            cursor: pointer;
        }

        #header h1 {
            font-size: 14px;
            display: inline-block;
            margin-left: 6px;
            color: var(--text-main, #ffffff);
        }

        /* Sidebar for Multi-Chat */
        #sidebar {
            display: none;
            position: absolute;
            top: 48px; left: 0; bottom: 0;
            width: 220px;
            background-color: var(--surface-color, #171717);
            border-right: 1px solid var(--border-color, #333333);
            z-index: 20;
            padding: 10px;
            overflow-y: auto;
        }

        .chat-item {
            padding: 8px;
            background-color: var(--bg-color, #212121);
            border: 1px solid var(--border-color, #333333);
            margin-bottom: 6px;
            color: var(--text-muted, #aaaaaa);
            cursor: pointer;
            font-size: 12px;
            word-break: break-all;
            position: relative;
        }

        .chat-item.active {
            border-color: var(--text-main, #ffffff);
            color: var(--text-main, #ffffff);
            font-weight: bold;
        }

        /* Settings Panel */
        #settings-panel {
            display: none;
            position: absolute;
            top: 48px; left: 0; right: 0; bottom: 0;
            background-color: var(--surface-color, #171717);
            border-bottom: 1px solid var(--border-color, #333333);
            padding: 12px;
            z-index: 15;
            overflow-y: auto;
        }

        .input-group {
            margin-bottom: 10px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            color: var(--text-muted, #aaaaaa);
            margin-bottom: 2px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 6px;
            background-color: var(--bg-color, #212121);
            border: 1px solid var(--border-light, #444444);
            color: var(--text-main, #ffffff);
            font-size: 12px;
        }

        .section-title {
            font-size: 12px;
            color: var(--text-main, #ffffff);
            margin: 12px 0 6px 0;
            border-bottom: 1px solid var(--border-color, #333333);
            padding-bottom: 4px;
        }

        /* Chat Display */
        #chat-container {
            position: absolute;
            top: 48px; bottom: 70px; left: 0; right: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 10px;
        }

        .message-row {
            margin-bottom: 10px;
            clear: both;
        }

        .message-bubble {
            max-width: 90%;
            padding: 8px 10px;
            word-wrap: break-word;
            font-size: 13px;
        }

        .user-message {
            float: right;
            background-color: var(--msg-user, #2f2f2f);
            color: var(--text-main, #ffffff);
            border: 1px solid var(--border-light, #444444);
        }

        .ai-message {
            float: left;
            background-color: var(--msg-ai, #171717);
            color: var(--text-main, #d1d5db);
            border: 1px solid var(--border-color, #333333);
            width: 100%;
        }

        .sender-name {
            font-size: 10px;
            color: var(--text-dark, #888888);
            margin-bottom: 4px;
            display: block;
        }

        /* Bottom Controls */
        #footer {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 70px;
            background-color: var(--surface-color, #171717);
            border-top: 1px solid var(--border-color, #333333);
            padding: 6px;
        }

        #file-preview {
            font-size: 10px;
            color: var(--text-dark, #888888);
            margin-bottom: 4px;
            height: 14px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        #prompt-input {
            width: 65%;
            height: 38px;
            background-color: var(--bg-color, #212121);
            border: 1px solid var(--border-light, #444444);
            color: var(--text-main, #ffffff);
            padding: 6px;
            font-size: 13px;
            float: left;
        }

        .file-label {
            width: 12%;
            height: 38px;
            float: left;
            margin-left: 1%;
            background-color: var(--btn-bg, #2f2f2f);
            color: var(--btn-text, #ffffff);
            border: 1px solid var(--border-light, #444444);
            text-align: center;
            line-height: 38px;
            font-size: 16px;
            cursor: pointer;
        }

        #send-btn {
            width: 20%;
            height: 38px;
            float: right;
            background-color: var(--primary-bg, #ffffff);
            color: var(--primary-text, #000000);
            border: none;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }

        /* EXTENDED FEATURE STYLES (No existing elements modified) */
        .chat-action-btn {
            position: absolute;
            right: 4px;
            top: 4px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 9px;
            padding: 2px 4px;
            cursor: pointer;
        }
        .chat-action-btn.del-btn { right: 38px; }

        #search-chats-input {
            width: 100%; padding: 6px; margin-bottom: 8px;
            background-color: var(--bg-color); border: 1px solid var(--border-light);
            color: var(--text-main); font-size: 11px;
        }
        .menu-link { display: block; color: var(--text-muted); font-size: 11px; margin-bottom: 6px; text-decoration: none; }
        .menu-link:hover { color: var(--text-main); text-decoration: underline; }
        
        /* Markdown Renderer Styles */
        .ai-message p { margin-bottom: 8px; }
        .ai-message pre { 
            background-color: #0d1117; color: #c9d1d9; padding: 10px; 
            overflow-x: auto; font-family: monospace; font-size: 11px; 
            margin: 8px 0; border: 1px solid var(--border-color);
            position: relative; 
        }
        .ai-message code { font-family: monospace; background-color: rgba(136, 136, 136, 0.2); padding: 2px 4px; }
        .ai-message pre code { background-color: transparent; padding: 0; }
        .ai-message table { border-collapse: collapse; width: 100%; margin: 8px 0; }
        .ai-message th, .ai-message td { border: 1px solid var(--border-color); padding: 4px; font-size: 11px; }
        .ai-message ul, .ai-message ol { padding-left: 20px; margin-bottom: 8px; }
        .ai-message blockquote { border-left: 3px solid var(--border-light); padding-left: 8px; color: var(--text-muted); }
        .copy-code-btn {
            position: absolute; right: 0; top: 0; background: #333; color: #fff; 
            border: none; padding: 4px 6px; font-size: 9px; cursor: pointer;
        }
        .drag-active { border: 2px dashed #ffffff !important; opacity: 0.8; }
    </style>
</head>
<body>

    <!-- Login Lock Screen (Preserved HTML, Bypassed via JS completely) -->
    <div id="login-overlay">
        <h2>Qwen AI Login</h2>
        <p style="font-size:11px; color:#888888; margin-top:4px;">Enter credentials to unlock app</p>
        <div class="login-box">
            <input type="text" id="login-user" placeholder="Username (Default: admin)">
            <input type="password" id="login-pass" placeholder="Password (Default: 1234)">
            <button onclick="checkLogin()">Login / Unlock</button>
        </div>
    </div>

    <!-- Header Navigation -->
    <div id="header">
        <button class="nav-btn" onclick="toggleSidebar()">☰ Chats</button>
        <h1>Ultimate AI Lite</h1>
        <button class="nav-btn" style="float:right;" onclick="toggleSettings()">Settings</button>
    </div>

    <!-- Sidebar (Multi-Chat List & Export/Import) -->
    <div id="sidebar">
        <!-- New Search Bar -->
        <input type="text" id="search-chats-input" placeholder="Search chats..." onkeyup="filterChats()">
        
        <button class="nav-btn" style="width:100%; margin-bottom:10px;" onclick="createNewChat()">+ New Chat</button>
        <div id="chat-list"></div>

        <div class="section-title">Chat File Backup</div>
        <button class="nav-btn" style="width:100%; margin-bottom:6px;" onclick="exportChatsToFile()">Export Chats to File</button>
        <label class="nav-btn" style="display:block; text-align:center; width:100%; cursor:pointer; margin-bottom:6px;">
            Import Chats from File
            <!-- Added multiple to support batch restoration if needed -->
            <input type="file" id="import-chat-file" style="display:none;" accept=".json" onchange="importChatsFromFile(event)" />
        </label>
        <button class="nav-btn" style="width:100%; margin-bottom:10px; color: #ff6b6b; border-color: #ff6b6b;" onclick="clearAllChats()">Clear All Chats</button>

        <div class="section-title">Project Menu</div>
        <a href="https://github.com/rakibul5879/ultimate-ai-lite" target="_blank" class="menu-link">🔗 GitHub Repository</a>
        <a href="https://github.com/rakibul5879/ultimate-ai-lite/wiki" target="_blank" class="menu-link">📖 Documentation</a>
        <a href="https://github.com/rakibul5879/ultimate-ai-lite/issues" target="_blank" class="menu-link">🐛 Report Issues</a>
        <a href="https://github.com/rakibul5879/ultimate-ai-lite/discussions" target="_blank" class="menu-link">💬 Discussions</a>
        <a href="https://github.com/rakibul5879/ultimate-ai-lite/blob/main/CONTRIBUTING.md" target="_blank" class="menu-link">🤝 Contribute</a>
        <a href="#" class="menu-link">ℹ️ About (v2.0)</a>
    </div>

    <!-- Settings Panel -->
    <div id="settings-panel">
        <div class="section-title">Theme Preference</div>
        <div class="input-group">
            <select id="app-theme-setting" onchange="saveSettings()">
                <option value="dark">Dark Mode</option>
                <option value="light">Light Mode</option>
                <option value="system">System Default</option>
            </select>
        </div>

        <div class="section-title">OpenRouter / AI Configuration</div>
        <div class="input-group">
            <label for="api-model-setting">Model:</label>
            <input type="text" id="api-model-setting" placeholder="openrouter/free" onchange="saveSettings()">
        </div>
        <div class="input-group">
            <label for="api-temp-setting">Temperature (0.0 - 2.0):</label>
            <input type="number" id="api-temp-setting" step="0.1" value="0.7" onchange="saveSettings()">
        </div>
        <div class="input-group">
            <label for="api-tokens-setting">Max Tokens:</label>
            <input type="number" id="api-tokens-setting" value="2000" onchange="saveSettings()">
        </div>
        <div class="input-group">
            <label for="api-worker-setting">Worker URL:</label>
            <input type="text" id="api-worker-setting" placeholder="Default Worker URL" onchange="saveSettings()">
        </div>
        
        <div class="section-title" style="display:none;">Account Security</div>
        <div class="input-group" style="display:none;">
            <label for="app-user-setting">App Username:</label>
            <input type="text" id="app-user-setting" onchange="saveSettings()">
        </div>
        <div class="input-group" style="display:none;">
            <label for="app-pass-setting">App Password:</label>
            <input type="password" id="app-pass-setting" onchange="saveSettings()">
        </div>

        <button class="nav-btn" style="width:100%; margin-top:10px;" onclick="toggleSettings()">Close Settings</button>
    </div>

    <!-- Chat Messages Scroll Container -->
    <div id="chat-container"></div>

    <!-- Bottom Input Area -->
    <div id="footer">
        <div id="file-preview">No file attached</div>
        <input type="text" id="prompt-input" placeholder="Type message or drag & drop files..." onkeypress="handleKeyPress(event)" />
        <label class="file-label" for="file-input">+</label>
        <input type="file" id="file-input" style="display:none;" multiple onchange="handleFileSelect(event)" />
        <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>

    <script type="text/javascript">
        // ==========================================
        // STATE VARIABLES
        // ==========================================
        var activeChatId = null;
        var allChats = {};
        var attachedFiles = []; // Upgraded to array for multiple files
        var hasUnsavedChanges = false; // Exit warning tracker

        // ==========================================
        // INITIALIZATION
        // ==========================================
        window.onload = function() {
            // Bypass login entirely as requested, without removing HTML
            document.getElementById('login-overlay').style.display = 'none';

            // Load saved settings
            document.getElementById('app-user-setting').value = localStorage.getItem('app_user') || 'admin';
            document.getElementById('app-pass-setting').value = localStorage.getItem('app_pass') || '1234';
            document.getElementById('api-model-setting').value = localStorage.getItem('api_model') || 'openrouter/free';
            document.getElementById('api-temp-setting').value = localStorage.getItem('api_temp') || '0.7';
            document.getElementById('api-tokens-setting').value = localStorage.getItem('api_tokens') || '2000';
            document.getElementById('api-worker-setting').value = localStorage.getItem('api_worker') || 'https://ultimate-ai-worker.rakibul-islam-rakib5879.workers.dev';
            
            var savedTheme = localStorage.getItem('app_theme') || 'dark';
            document.getElementById('app-theme-setting').value = savedTheme;
            applyTheme(savedTheme);

            loadChatsFromStorage();
            setupDragAndDrop();
        };

        // Preserve required login function per constraints (but it is dead code now)
        function checkLogin() {
            document.getElementById('login-overlay').style.display = 'none';
        }

        // ==========================================
        // EXIT WARNING (beforeunload)
        // ==========================================
        window.onbeforeunload = function(e) {
            if (hasUnsavedChanges) {
                var msg = "You have unsaved or un-exported chats. Are you sure you want to exit?";
                e.returnValue = msg;
                return msg;
            }
        };

        // ==========================================
        // SETTINGS & THEME
        // ==========================================
        function saveSettings() {
            localStorage.setItem('app_user', document.getElementById('app-user-setting').value || 'admin');
            localStorage.setItem('app_pass', document.getElementById('app-pass-setting').value || '1234');
            localStorage.setItem('api_model', document.getElementById('api-model-setting').value || 'openrouter/free');
            localStorage.setItem('api_temp', document.getElementById('api-temp-setting').value || '0.7');
            localStorage.setItem('api_tokens', document.getElementById('api-tokens-setting').value || '2000');
            localStorage.setItem('api_worker', document.getElementById('api-worker-setting').value || '');
            
            var theme = document.getElementById('app-theme-setting').value;
            localStorage.setItem('app_theme', theme);
            applyTheme(theme);
        }

        function applyTheme(themeName) {
            if (themeName === 'system') {
                var isLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
                document.documentElement.setAttribute('data-theme', isLight ? 'light' : 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', themeName);
            }
        }

        // ==========================================
        // UI TOGGLES
        // ==========================================
        function toggleSidebar() {
            var sb = document.getElementById('sidebar');
            sb.style.display = (sb.style.display === 'block') ? 'none' : 'block';
        }

        function toggleSettings() {
            var st = document.getElementById('settings-panel');
            st.style.display = (st.style.display === 'block') ? 'none' : 'block';
        }

        // ==========================================
        // CHAT STORAGE & MANAGEMENT
        // ==========================================
        function loadChatsFromStorage() {
            var raw = localStorage.getItem('qwen_chat_data');
            if (raw) {
                try { allChats = JSON.parse(raw); } catch(e) { allChats = {}; }
            }
            var keys = [];
            for (var k in allChats) { keys.push(k); }

            if (keys.length === 0) {
                createNewChat();
            } else {
                renderChatList();
                switchChat(keys[keys.length - 1]); // Open most recent
            }
        }

        function saveChatsToStorage() {
            localStorage.setItem('qwen_chat_data', JSON.stringify(allChats));
            hasUnsavedChanges = true;
        }

        function createNewChat() {
            var id = 'chat_' + new Date().getTime();
            allChats[id] = {
                title: 'New Chat',
                messages: []
            };
            saveChatsToStorage();
            renderChatList();
            switchChat(id);
            
            // Auto close sidebar on mobile after creation
            if (window.innerWidth < 768 && document.getElementById('sidebar').style.display === 'block') {
                toggleSidebar();
            }
        }

        function switchChat(id) {
            if (!allChats[id]) return;
            activeChatId = id;
            renderChatList();
            renderMessages();
            if (window.innerWidth < 768 && document.getElementById('sidebar').style.display === 'block') {
                toggleSidebar();
            }
        }

        // ==========================================
        // SIDEBAR ACTIONS (Rename, Delete, Clear, Search)
        // ==========================================
        function deleteChat(id, event) {
            event.stopPropagation();
            if (confirm("Delete this chat?")) {
                delete allChats[id];
                saveChatsToStorage();
                var keys = Object.keys(allChats);
                if (keys.length === 0) createNewChat();
                else switchChat(keys[0]);
            }
        }

        function renameChat(id, event) {
            event.stopPropagation();
            var newTitle = prompt("Enter new title:", allChats[id].title);
            if (newTitle) {
                allChats[id].title = newTitle;
                saveChatsToStorage();
                renderChatList();
            }
        }

        function clearAllChats() {
            if (confirm("Are you sure you want to clear ALL chats? This cannot be undone!")) {
                allChats = {};
                saveChatsToStorage();
                createNewChat();
            }
        }

        function filterChats() {
            var query = document.getElementById('search-chats-input').value.toLowerCase();
            var items = document.getElementsByClassName('chat-item');
            for (var i = 0; i < items.length; i++) {
                var title = items[i].getAttribute('data-title').toLowerCase();
                items[i].style.display = title.indexOf(query) > -1 ? 'block' : 'none';
            }
        }

        function renderChatList() {
            var listEl = document.getElementById('chat-list');
            listEl.innerHTML = '';
            
            // Sort by newest first based on ID timestamp logic
            var keys = Object.keys(allChats).sort(function(a, b) { return b.replace('chat_', '') - a.replace('chat_', ''); });

            for (var i = 0; i < keys.length; i++) {
                var id = keys[i];
                var div = document.createElement('div');
                div.className = 'chat-item' + (id === activeChatId ? ' active' : '');
                div.setAttribute('data-title', allChats[id].title);
                
                var titleSpan = document.createElement('span');
                titleSpan.innerText = allChats[id].title;
                div.appendChild(titleSpan);

                // Add Rename Button
                var renBtn = document.createElement('button');
                renBtn.className = 'chat-action-btn del-btn';
                renBtn.innerText = '✎';
                renBtn.onclick = (function(chatId) { return function(e) { renameChat(chatId, e); }; })(id);
                
                // Add Delete Button
                var delBtn = document.createElement('button');
                delBtn.className = 'chat-action-btn';
                delBtn.innerText = '×';
                delBtn.onclick = (function(chatId) { return function(e) { deleteChat(chatId, e); }; })(id);

                div.appendChild(renBtn);
                div.appendChild(delBtn);

                div.onclick = (function(chatId) {
                    return function() { switchChat(chatId); };
                })(id);
                listEl.appendChild(div);
            }
        }

        // ==========================================
        // MESSAGE RENDERING (Markdown + Purify)
        // ==========================================
        function renderMessages() {
            var container = document.getElementById('chat-container');
            container.innerHTML = '';
            var msgs = allChats[activeChatId] ? allChats[activeChatId].messages : [];
            for (var i = 0; i < msgs.length; i++) {
                appendMessageUI(msgs[i].role, msgs[i].content);
            }
        }

        function renderMarkdown(text) {
            if (typeof marked !== 'undefined' && typeof DOMPurify !== 'undefined') {
                marked.setOptions({
                    breaks: true,
                    highlight: function(code, lang) {
                        if (typeof hljs !== 'undefined') {
                            if (lang && hljs.getLanguage(lang)) return hljs.highlight(code, { language: lang }).value;
                            return hljs.highlightAuto(code).value;
                        }
                        return code;
                    }
                });
                return DOMPurify.sanitize(marked.parse(text));
            }
            // Fallback for missing CDN
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, '<br>');
        }

        function appendMessageUI(role, content, customId) {
            var container = document.getElementById('chat-container');
            var row = document.createElement('div');
            row.className = 'message-row';
            if (customId) row.id = customId;

            var bubble = document.createElement('div');
            bubble.className = 'message-bubble ' + (role === 'user' ? 'user-message' : 'ai-message');

            var sender = document.createElement('span');
            sender.className = 'sender-name';
            sender.innerText = (role === 'user' ? 'You' : 'Ultimate AI');

            var contentDiv = document.createElement('div');
            
            if (typeof content === 'string') {
                if (role === 'assistant') {
                    contentDiv.innerHTML = renderMarkdown(content);
                    // Add copy buttons to code blocks
                    var preBlocks = contentDiv.querySelectorAll('pre');
                    for (var b = 0; b < preBlocks.length; b++) {
                        var cBtn = document.createElement('button');
                        cBtn.className = 'copy-code-btn';
                        cBtn.innerText = 'Copy';
                        cBtn.onclick = function() {
                            var code = this.parentElement.querySelector('code').innerText;
                            navigator.clipboard.writeText(code);
                            this.innerText = 'Copied!';
                            var self = this;
                            setTimeout(function() { self.innerText = 'Copy'; }, 2000);
                        };
                        preBlocks[b].appendChild(cBtn);
                    }
                } else {
                    contentDiv.innerText = content;
                }
            } else if (typeof content === 'object') {
                // Object mapping fallback
                var textParts = [];
                for (var j = 0; j < content.length; j++) {
                    if (content[j].type === 'text') textParts.push(content[j].text);
                    if (content[j].type === 'image_url') textParts.push('[Attached Image]');
                }
                contentDiv.innerText = textParts.join("\n");
            }

            bubble.appendChild(sender);
            bubble.appendChild(contentDiv);
            row.appendChild(bubble);
            container.appendChild(row);

            container.scrollTop = container.scrollHeight;
        }

        // ==========================================
        // EXPORT / IMPORT
        // ==========================================
        function exportChatsToFile() {
            var jsonString = JSON.stringify(allChats, null, 2);
            var blob = new Blob([jsonString], { type: "application/json" });
            var a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "ultimate_ai_backup_" + new Date().toISOString().substring(0, 10) + ".json";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            hasUnsavedChanges = false; // Reset warning flag
        }

        function importChatsFromFile(evt) {
            var file = evt.target.files[0];
            if (!file) return;

            var reader = new FileReader();
            reader.onload = function(e) {
                try {
                    var imported = JSON.parse(e.target.result);
                    if (typeof imported === 'object') {
                        // Merge or overwrite (here we merge)
                        for (var k in imported) { allChats[k] = imported[k]; }
                        saveChatsToStorage();
                        loadChatsFromStorage();
                        alert('Chats imported successfully!');
                    } else {
                        alert('Invalid chat file format.');
                    }
                } catch(err) {
                    alert('Failed to parse chat file.');
                }
            };
            reader.readAsText(file);
        }

        // ==========================================
        // FILE SUPPORT (Multiple & Drag/Drop)
        // ==========================================
        function setupDragAndDrop() {
            var body = document.body;
            body.addEventListener('dragover', function(e) {
                e.preventDefault(); e.stopPropagation();
                document.getElementById('footer').classList.add('drag-active');
            });
            body.addEventListener('dragleave', function(e) {
                e.preventDefault(); e.stopPropagation();
                document.getElementById('footer').classList.remove('drag-active');
            });
            body.addEventListener('drop', function(e) {
                e.preventDefault(); e.stopPropagation();
                document.getElementById('footer').classList.remove('drag-active');
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    processFiles(e.dataTransfer.files);
                }
            });
        }

        function handleFileSelect(e) {
            processFiles(e.target.files);
        }

        function processFiles(files) {
            if (!files || files.length === 0) return;
            for (var i = 0; i < files.length; i++) {
                (function(file) {
                    var reader = new FileReader();
                    var isImage = file.type.indexOf('image/') === 0;
                    var isText = file.type.indexOf('text/') === 0 || file.name.match(/\.(txt|json|js|py|html|css|md|csv|xml|c|cpp|java|php)$/i);
                    
                    if (isImage) {
                        reader.onload = function(evt) {
                            attachedFiles.push({ type: 'image_url', name: file.name, dataUrl: evt.target.result });
                            updateFilePreview();
                        };
                        reader.readAsDataURL(file);
                    } else if (isText) {
                        reader.onload = function(evt) {
                            attachedFiles.push({ type: 'text', name: file.name, content: evt.target.result });
                            updateFilePreview();
                        };
                        reader.readAsText(file);
                    } else {
                        attachedFiles.push({ type: 'binary', name: file.name, size: file.size, mime: file.type || 'application/octet-stream' });
                        updateFilePreview();
                    }
                })(files[i]);
            }
        }

        function updateFilePreview() {
            var prev = document.getElementById('file-preview');
            if (attachedFiles.length === 0) {
                prev.innerText = 'No file attached';
            } else {
                prev.innerText = attachedFiles.length + ' file(s) attached (' + attachedFiles[attachedFiles.length-1].name + ')';
            }
        }

        function handleKeyPress(e) {
            if ((e.keyCode || e.which) === 13) sendMessage();
        }

        // ==========================================
        // SYSTEM PROMPT & IDENTITY INJECTION
        // ==========================================
        function generateSystemInstruction() {
            var modelStr = (document.getElementById('api-model-setting').value || 'openrouter/free').toLowerCase();
            var identity = "You are an advanced AI assistant.";
            
            if (modelStr.indexOf('openai') !== -1 || modelStr.indexOf('chatgpt') !== -1) identity = "You are ChatGPT, a large language model developed by OpenAI.";
            else if (modelStr.indexOf('anthropic') !== -1 || modelStr.indexOf('claude') !== -1) identity = "You are Claude, a large language model developed by Anthropic.";
            else if (modelStr.indexOf('google') !== -1 || modelStr.indexOf('gemini') !== -1) identity = "You are Gemini, a large language model developed by Google.";
            else if (modelStr.indexOf('meta') !== -1 || modelStr.indexOf('llama') !== -1) identity = "You are Llama, a large language model developed by Meta.";
            else if (modelStr.indexOf('qwen') !== -1 || modelStr.indexOf('alibaba') !== -1) identity = "You are Qwen, a large language model developed by Alibaba Cloud.";
            else if (modelStr.indexOf('deepseek') !== -1) identity = "You are DeepSeek, a large language model developed by DeepSeek.";
            else if (modelStr.indexOf('microsoft') !== -1 || modelStr.indexOf('phi') !== -1) identity = "You are Phi, a large language model developed by Microsoft.";
            else if (modelStr.indexOf('xai') !== -1 || modelStr.indexOf('grok') !== -1) identity = "You are Grok, a large language model developed by xAI.";

            var metaInfo = "This interface is Ultimate AI Lite, an open-source application created and maintained by Rakibul5879. Repository: https://github.com/rakibul5879/ultimate-ai-lite. GitHub Pages: https://rakibul5879.github.io/ultimate-ai-lite/. Never claim you were created by Rakibul5879.";
            var docInfo = "If the user asks 'I want to contribute', 'How can I contribute', or asks to generate a CONTRIBUTING guide, generate a professional CONTRIBUTING.md. If they ask for a README, generate a professional README.md. If they ask for the LICENSE, output the MIT License format.";
            
            return {
                role: "system",
                content: identity + " " + metaInfo + " " + docInfo + " Use professional formatting."
            };
        }

        // ==========================================
        // MAIN API REQUEST
        // ==========================================
        function sendMessage() {
            var input = document.getElementById('prompt-input');
            var text = input.value;

            if ((!text || text.length === 0) && attachedFiles.length === 0) return;

            var formattedMessageContent = text;

            // Compile attached files to prompt string (or object format depending on API config)
            if (attachedFiles.length > 0) {
                var fileSummary = "\n\n[USER ATTACHED FILES]\n";
                for (var f = 0; f < attachedFiles.length; f++) {
                    var fObj = attachedFiles[f];
                    fileSummary += "--- " + fObj.name + " ---\n";
                    if (fObj.type === 'text') fileSummary += fObj.content + "\n";
                    else fileSummary += "[Binary/Image File Placeholder]\n";
                }
                formattedMessageContent = (text ? text : '') + fileSummary;
            }

            input.value = '';
            
            // Re-package files for the Worker strictly formatted for the worker.js attachment array
            var workerAttachments = [];
            for (var w=0; w < attachedFiles.length; w++) {
                if (attachedFiles[w].type === 'text') {
                    workerAttachments.push({
                        name: attachedFiles[w].name,
                        content: attachedFiles[w].content
                    });
                }
            }

            attachedFiles = [];
            updateFilePreview();
            document.getElementById('send-btn').disabled = true;

            // Auto-title on first user message
            var isFirstMessage = allChats[activeChatId].messages.length === 0;
            if (isFirstMessage) {
                var cleanTitle = text.substring(0, 25).replace(/\n/g, ' ') || 'File Upload';
                allChats[activeChatId].title = cleanTitle;
            }

            allChats[activeChatId].messages.push({ role: 'user', content: formattedMessageContent });
            saveChatsToStorage();
            
            if (isFirstMessage) renderChatList();
            appendMessageUI('user', formattedMessageContent);

            var loadingId = 'loading_' + new Date().getTime();
            appendMessageUI('assistant', '...', loadingId);

            var defaultWorker = 'https://ultimate-ai-worker.rakibul-islam-rakib5879.workers.dev';
            var endpoint = document.getElementById('api-worker-setting').value || defaultWorker;

            var xhr = new XMLHttpRequest();
            xhr.open('POST', endpoint, true);
            xhr.setRequestHeader('Content-Type', 'application/json');

            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    document.getElementById('send-btn').disabled = false;
                    
                    var loadingElem = document.getElementById(loadingId);
                    if (loadingElem && loadingElem.parentNode) {
                        loadingElem.parentNode.removeChild(loadingElem);
                    }

                    if (xhr.status === 200) {
                        try {
                            var response = JSON.parse(xhr.responseText);
                            var aiReply = response.choices[0].message.content;
                            allChats[activeChatId].messages.push({ role: 'assistant', content: aiReply });
                            saveChatsToStorage();
                            appendMessageUI('assistant', aiReply);
                        } catch(err) {
                            appendMessageUI('assistant', 'JSON Parsing Error');
                        }
                    } else {
                        appendMessageUI('assistant', 'Error ' + xhr.status + ': ' + xhr.responseText);
                    }
                }
            };

            var requestMessages = [generateSystemInstruction()].concat(allChats[activeChatId].messages);

            // Send full configuration payload mapped perfectly to worker requirements
            var payload = JSON.stringify({
                model: document.getElementById('api-model-setting').value || 'openrouter/free',
                temperature: parseFloat(document.getElementById('api-temp-setting').value) || 0.7,
                max_tokens: parseInt(document.getElementById('api-tokens-setting').value) || 2000,
                messages: requestMessages,
                attachments: workerAttachments.length > 0 ? workerAttachments : undefined
            });

            xhr.send(payload);
        }
    </script>
